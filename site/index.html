<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Ian Wardell, J.D.'s professional links, including LinkedIn, research, code, and résumé.">
  <meta name="theme-color" content="#0b1020">
  <meta property="og:title" content="Ian Wardell, J.D. | Links">
  <meta property="og:description" content="Privacy engineering, security, research, and professional experience.">
  <meta property="og:type" content="website">
  <title>Ian Wardell, J.D. | Links</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/styles.css">
  <script>
    (() => {
      const savedTheme = localStorage.getItem('theme');
      if (savedTheme) document.documentElement.dataset.theme = savedTheme;
    })();
  </script>
</head>
<body>
  <div class="ambient ambient-one" aria-hidden="true"></div>
  <div class="ambient ambient-two" aria-hidden="true"></div>
  <div class="grid-overlay" aria-hidden="true"></div>

  <main class="page-shell">
    <section class="profile-card" aria-labelledby="profile-name">
      <header class="profile-header">
        <div class="identity-row">
          <div class="avatar">
            <img src="assets/images/ian-wardell-headshot.jpg" alt="Portrait of Ian Wardell">
          </div>

          <button class="theme-toggle" type="button" aria-label="Switch color theme" title="Switch color theme">
            <svg class="sun-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 4V2m0 20v-2m8-8h2M2 12h2m13.66-5.66 1.42-1.42M4.92 19.08l1.42-1.42m11.32 0 1.42 1.42M4.92 4.92l1.42 1.42M12 17a5 5 0 1 0 0-10 5 5 0 0 0 0 10Z"/>
            </svg>
            <svg class="moon-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20.2 15.5A8.5 8.5 0 0 1 8.5 3.8 8.5 8.5 0 1 0 20.2 15.5Z"/>
            </svg>
          </button>
        </div>

        <div class="eyebrow"><span></span> Links</div>
        <h1 id="profile-name">Ian Wardell, J.D.</h1>
        <p class="tagline">Privacy engineering, security, and responsible technology.</p>
      </header>

      <nav class="link-list" aria-label="Ian Wardell, J.D. links">
        <a class="link-card linkedin" href="https://www.linkedin.com/in/ian-wardell/" target="_blank" rel="noopener noreferrer">
          <span class="icon-wrap" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M6.5 8.25H3.25V21H6.5V8.25ZM4.88 3A1.88 1.88 0 1 0 4.88 6.75 1.88 1.88 0 0 0 4.88 3ZM21 13.69c0-3.84-2.05-5.63-4.79-5.63-2.2 0-3.19 1.21-3.74 2.06V8.25H9.22V21h3.25v-6.32c0-1.67.32-3.29 2.39-3.29 2.04 0 2.07 1.91 2.07 3.4V21H21v-7.31Z"/></svg>
          </span>
          <span class="link-copy">
            <span class="link-title">LinkedIn</span>
            <span class="link-url">linkedin.com/in/ian-wardell</span>
          </span>
          <span class="open-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M7 17 17 7M9 7h8v8"/></svg>
          </span>
        </a>

        <a class="link-card resume" href="https://www.resume.ianwardell.com/" target="_blank" rel="noopener noreferrer">
          <span class="icon-wrap" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6V3Zm8 0v5h4M9 12h6m-6 4h6"/></svg>
          </span>
          <span class="link-copy">
            <span class="link-title">Résumé</span>
            <span class="link-url">resume.ianwardell.com</span>
          </span>
          <span class="open-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M7 17 17 7M9 7h8v8"/></svg>
          </span>
        </a>

        <a class="link-card research" href="https://www.research.ianwardell.com/" target="_blank" rel="noopener noreferrer">
          <span class="icon-wrap" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V4H6.5A2.5 2.5 0 0 0 4 6.5v13Zm0 0A2.5 2.5 0 0 0 6.5 22H20v-5H6.5A2.5 2.5 0 0 0 4 19.5ZM8 8h8m-8 4h5"/></svg>
          </span>
          <span class="link-copy">
            <span class="link-title">Research</span>
            <span class="link-url">research.ianwardell.com</span>
          </span>
          <span class="open-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M7 17 17 7M9 7h8v8"/></svg>
          </span>
        </a>

        <a class="link-card git" href="https://www.git.ianwardell.com/" target="_blank" rel="noopener noreferrer">
          <span class="icon-wrap" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="m8.5 8.5 3-3 4 4-3 3m-4-4 7 7M6.5 6.5a2 2 0 1 1 0-4 2 2 0 0 1 0 4Zm11 15a2 2 0 1 1 0-4 2 2 0 0 1 0 4Zm0-10a2 2 0 1 1 0-4 2 2 0 0 1 0 4ZM6.5 6.5v7a4 4 0 0 0 4 4h5"/></svg>
          </span>
          <span class="link-copy">
            <span class="link-title">Git</span>
            <span class="link-url">git.ianwardell.com</span>
          </span>
          <span class="open-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M7 17 17 7M9 7h8v8"/></svg>
          </span>
        </a>

      </nav>

      <footer class="profile-footer">
        <a href="https://ianwardell.com/" data-home-link target="_blank" rel="noopener noreferrer">ianwardell.com</a>
        <span aria-hidden="true">•</span>
        <span>Privacy · Security · Research</span>
      </footer>
    </section>
  </main>

  <script>
    const themeButton = document.querySelector('.theme-toggle');
    const homeLink = document.querySelector('[data-home-link]');
    const root = document.documentElement;

    if (['ianwardell.com', 'www.ianwardell.com'].includes(window.location.hostname.toLowerCase())) {
      homeLink.href = '/';
      homeLink.removeAttribute('target');
      homeLink.removeAttribute('rel');
    }

    themeButton.addEventListener('click', () => {
      const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const currentTheme = root.dataset.theme || (systemDark ? 'dark' : 'light');
      const nextTheme = currentTheme === 'dark' ? 'light' : 'dark';
      root.dataset.theme = nextTheme;
      localStorage.setItem('theme', nextTheme);
    });
  </script>
</body>
</html>
